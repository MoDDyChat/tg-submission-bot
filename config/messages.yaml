# Тексты бота. Любую строку ниже можно отредактировать — плейсхолдеры вида
# {sub_id}, {user}, {reason} нельзя убирать или переименовывать: бот проверяет их
# набор при старте и не запустится, если он не совпадёт с ожидаемым.
#
# HTML-теги (<b>, <i>, <code> и т.п.) сохраняются как есть — Telegram отрисует их
# как форматирование, а не как текст.
#
# Путь к этому файлу задаётся через MESSAGES_PATH (.env), по умолчанию
# config/messages.yaml.

RULES: |-
  Привет! Я бот-предложка творчества.
  Вы можете поделиться своим творчеством через меня, и в случае прохождения модерации ваш пост будет опубликован в канале.

  <b>Как предложить пост:</b>
  • Отправь мне изображение, видео или текст.
  • Можно прикреплять сразу несколько файлов за раз.
  • Обязательно укажи ссылку на себя (тгк, группа ВК или что угодно, если есть)!

  <b>Правила:</b>
  • Контент должен быть авторским или с обязательным указанием источника.
  • Без NSFW, 18+, AI, спама и оскорблений.
  • Кровь, оголённый торс и сцены близости — под спойлер!
  • Количество предложенных постов не ограничено.

  После модерации пост будет опубликован в основном канале, и ты получишь уведомление об этом. Модераторы оставляют право отклонить публикацию без уведомления.
HELP: |-
  <b>Доступные команды:</b>

  /start — правила предложки
  /help — эта справка
  /cancel — отменить текущее действие
