# Явная конфигурация линтера.
#
# Без неё набор правил определяется версией ruff: 0.16 расширил свой дефолт
# и выдал 154 замечания на коде, который 0.15 считал чистым. Набор ниже —
# то, что проект соблюдает: ошибки синтаксиса и импортов, неиспользуемые
# имена, недостижимый код. Стилевые придирки сюда намеренно не входят.
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Модули-фасады реэкспортируют символы, которые сами не используют.
"src/db/queries/__init__.py" = ["F401"]
